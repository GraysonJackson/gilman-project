---
layout: default
title: Blog
permalink: /blog/
---
<div class="prose">
  <header class="post-head"><h1>Blog</h1></header>
  {% if site.posts.size > 0 %}
  <ul class="rows">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <span class="meta">{{ post.date | date: "%B %-d, %Y" }}</span>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No posts yet.</p>
  {% endif %}
</div>
